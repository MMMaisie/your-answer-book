{% extends 'base.html' %}{% block content %}<section class="history"><p class="eyebrow">MY READINGS</p><h1>{{t('留住这一卦。')}}</h1><p>{{t('显示此浏览器最近30次解读。清除浏览器数据后，请通过你保存的私密链接访问。')}}</p>{% for r in rows %}<a class="history-row" href="{{url_for('reading_page',access=r.access_key)}}"><span>{{r.cast_time}}</span><h2>{{r.question}}</h2><small>{{t('查看此卦')}}</small></a>{% else %}<div class="empty-state"><h2>{{t('尚未起卦')}}</h2><p>{{t('不急着问。先想清一件真正需要判断的事。')}}</p><a href="{{url_for('home')}}" class="text-link">{{t('开始起卦')}}</a></div>{% endfor %}</section>{% endblock %}
